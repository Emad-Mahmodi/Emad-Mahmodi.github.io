- title: Profile
  type: list
  contents:
    - Software engineer and applied-ML researcher with 10+ years building production systems, spanning <b>machine learning &amp; data mining</b>, <b>algorithms &amp; high-performance computing</b>, and <b>software / security engineering</b>. Three peer-reviewed publications in anomaly detection and recommender systems.
    - Core strength is turning hard, structured data — binaries, graphs, network traffic — into working ML and systems: from a drift-aware anomaly-detection ensemble (ESWA 2020) to GPU-accelerated graph analytics and LLM/RAG pipelines for binary analysis.
    - Seeking research/graduate opportunities at the intersection of machine learning, algorithms, and systems — including AI for security, ML systems &amp; generalization, and data-driven scientific computing.

